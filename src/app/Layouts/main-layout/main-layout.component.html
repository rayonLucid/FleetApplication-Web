<div class="layout-container">
  <app-sidebar [class.collapsed]="isSidebarCollapsed" 
   [class.mobile-open]="isMobileOpen" [isMobileOpen]="isMobileOpen" [isCollapsed]="isSidebarCollapsed" (toggleMobile)="isMobileOpen = !isMobileOpen"></app-sidebar>
 
  <main class="main-content" [class.sidebar-collapsed]="isSidebarCollapsed" [class.mobile-open]="isMobileOpen">
    <app-header (toggleMobile)="toggleMobile()" ></app-header>
    <router-outlet></router-outlet>
  </main>
</div>
