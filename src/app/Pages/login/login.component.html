<div class="login-wrapper">
  <div class="login-box">
    <div class="login-header">
      <h2>Fleet Management System</h2>
      <p>Sign in to access your multi-tenant tenant dashboard</p>
    </div>

    <div *ngIf="errorMessage" class="login-alert">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="field-group">
        <label class="field-label">Email Address</label>
        <input type="email"
               formControlName="email"
               [class.input-invalid]="isFieldInvalid('email')"
               class="field-input"
               placeholder="name@company.com" />
        <p *ngIf="isFieldInvalid('email')" class="error-msg">Please enter a valid company email address.</p>
      </div>

      <div class="field-group">
        <label class="field-label">Password</label>
        <input type="password"
               formControlName="password"
               [class.input-invalid]="isFieldInvalid('password')"
               class="field-input"
               autocomplete="new-password"
               placeholder="••••••••" />
        <p *ngIf="isFieldInvalid('password')" class="error-msg">Password validation checkpoint required (min 6 characters).</p>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="loginForm.invalid || isSubmitting" class="btn-login">
          <span *ngIf="isSubmitting" class="btn-spinner"></span>
          <span>{{ isSubmitting ? 'Authenticating Credentials...' : 'Sign In To Account' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
